networks:
  proxy:
    external: true

services:
    komga:
      image: gotson/komga:1.27.0@sha256:341f1e7dbd48a42f4df7d0af40f7a6644d7db0b2ed6ea8cbc8c0ccaa71e48b66
      volumes:
        - ./data/config:/config
        - ./data/app:/data
        - /mnt/nas/content/media/manga:/library
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=America/New_York
      restart: unless-stopped
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.komga.middlewares=crowdsec-traefik-bouncer,auth"
        - "traefik.http.routers.komga.rule=Host(`${SERVICE_SUBDOMAIN:-manga}.${SERVICES_BASE_DOMAIN}`)"
        - "traefik.http.routers.komga.tls=true"
        - "traefik.http.services.komga.loadbalancer.server.port=25600"
      networks:
        - proxy
