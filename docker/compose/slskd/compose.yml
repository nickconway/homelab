networks:
  proxy:
    external: true

services:
  slskd:
    image: slskd/slskd:0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
    networks:
      - proxy
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    user: 1000:1000
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - ./data/slskd.yml:/app/slskd.yml
      - ./data/app:/app/data
      - /mnt/nas/content/incomplete:/data/incomplete
      - /mnt/nas/content/downloads:/data/downloads
      - /mnt/nas/content/media/music:/shares:ro
    restart: unless-stopped
