networks:
  proxy:
    external: true
  healthchecks:
    name: healthchecks

services:
  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
    networks:
      - healthchecks
    restart: unless-stopped

  web:
    image: healthchecks/healthchecks:v5.0.3@sha256:5eb96eb72dc63ac24743f1c0fc4469931155329e05c9781a0809320de0ae479c
    env_file: .env
    networks:
      - proxy
      - healthchecks
    depends_on:
        - db
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; /opt/healthchecks/run.sh'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.healthchecks.middlewares=crowdsec-traefik-bouncer"
      - "traefik.http.routers.healthchecks.rule=Host(`${SERVICE_SUBDOMAIN:-health}.${SERVICES_BASE_DOMAIN}`)"
      - "traefik.http.routers.healthchecks.tls=true"
      - "traefik.http.services.healthchecks.loadbalancer.server.port=8000"
    restart: unless-stopped
