networks:
  proxy:
    external: true

services:
  syncthing:
    image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/var/syncthing
      - ${SYNC_DIR}:/var/syncthing/sync
    networks:
      - proxy
    restart: unless-stopped
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.middlewares=crowdsec-traefik-bouncer,auth"
      - "traefik.http.routers.syncthing.rule=Host(`${SERVICE_SUBDOMAIN:-sync}.${SERVICES_BASE_DOMAIN}`)"
      - "traefik.http.routers.syncthing.tls=true"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
