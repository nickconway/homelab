networks:
  proxy:
    external: true

services:
  mkdocs:
    image: squidfunk/mkdocs-material:9.8.0@sha256:dc3b5de76c6e30d18dc0922d4c4a7bed817e5e155f9ff0e594a53eb56e537e64
    networks:
      - proxy
    volumes:
      - ./config:/docs
    environment:
      PUID: 1000
      PGID: 1000
      SITE_NAME: "Nick Conway's Homelab"
      SITE_URL: https://${SERVICE_SUBDOMAIN:-homelab}.${SERVICES_BASE_DOMAIN}
      REPO_URL: https://github.com/nickconway/homelab
      HOMEPAGE: https://${SERVICE_SUBDOMAIN:-homelab}.${SERVICES_BASE_DOMAIN}
      GITHUB_LINK: https://github.com/nickconway
      MASTODON_LINK: https://mastodon.social/@nickconway
      LOGO: favicon.png
      FAVICON: favicon.png
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mkdocs.middlewares=crowdsec-traefik-bouncer"
      - "traefik.http.routers.mkdocs.rule=Host(`${SERVICE_SUBDOMAIN:-homelab}.${SERVICES_BASE_DOMAIN}`)"
      - "traefik.http.routers.mkdocs.tls=true"
      - "traefik.http.services.mkdocs.loadbalancer.server.port=8000"
    restart: unless-stopped
