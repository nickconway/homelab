        image: renovate/renovate:44.11.3@sha256:60b0ebaf84c77013b7e2e769f748a0bea0f09d25bca58b58e4839bb42400d8dd
        environment:
          - LOG_LEVEL=debug
          - RENOVATE_CONFIG_FILE=/config.js
