networks:
  proxy:
    external: true
  healthchecks:
    name: healthchecks

services:
  db:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
    networks:
      - healthchecks
    restart: unless-stopped

  web:
    image: healthchecks/healthchecks:v5.0.1@sha256:206b3c6fd8e1562505bc10bc6f1e2c838e67614bd7e1ea762058338fe3f7f5bb
    env_file: .env
    networks:
      - proxy
      - healthchecks
    depends_on:
        - db
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; /opt/healthchecks/run.sh'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.healthchecks.middlewares=crowdsec-traefik-bouncer"
      - "traefik.http.routers.healthchecks.rule=Host(`${SERVICE_SUBDOMAIN:-health}.${SERVICES_BASE_DOMAIN}`)"
      - "traefik.http.routers.healthchecks.tls=true"
      - "traefik.http.services.healthchecks.loadbalancer.server.port=8000"
    restart: unless-stopped
