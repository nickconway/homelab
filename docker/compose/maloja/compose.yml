networks:
  proxy:
    external: true

services:
  maloja:
    image: krateng/maloja:3.2.7@sha256:8864145b0107f9edfdd6672b366deb84378f4b20ea48730206bc5a56e3f82460
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - MALOJA_DATA_DIRECTORY=/mljdata
      - MALOJA_SKIP_SETUP=true
      - MALOJA_FORCE_PASSWORD=$MALOJA_FORCE_PASSWORD
    volumes:
      - ./data/app:/mljdata
      - ./data/backups:/usr/src/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maloja.middlewares=crowdsec-traefik-bouncer"
      - "traefik.http.routers.maloja.rule=Host(`${SERVICE_SUBDOMAIN:-scrobble}.${SERVICES_BASE_DOMAIN}`)"
      - "traefik.http.routers.maloja.tls=true"
      - "traefik.http.services.maloja.loadbalancer.server.port=42010"
    restart: unless-stopped
