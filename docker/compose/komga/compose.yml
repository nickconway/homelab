networks:
  proxy:
    external: true

services:
    komga:
      image: gotson/komga:1.26.1@sha256:e109902ebebb8a05f633f48d84a2ac7bb1334bf0f6fbc17262a333082c7de44d
      volumes:
        - ./data/config:/config
        - ./data/app:/data
        - /mnt/nas/content/media/manga:/library
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=America/New_York
      restart: unless-stopped
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.komga.middlewares=crowdsec-traefik-bouncer,auth"
        - "traefik.http.routers.komga.rule=Host(`${SERVICE_SUBDOMAIN:-manga}.${SERVICES_BASE_DOMAIN}`)"
        - "traefik.http.routers.komga.tls=true"
        - "traefik.http.services.komga.loadbalancer.server.port=25600"
      networks:
        - proxy
